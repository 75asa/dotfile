# プロンプト全体のフォーマット
format = """
$directory$git_branch$git_status$nodejs$python$rust
$character"""

[directory]
style = "bold cyan"
truncation_length = 3

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
conflicted = "⚠️"
modified = "✏️"
untracked = "?"
ahead = "⬆️${count}"
behind = "⬇️${count}"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[nodejs]
symbol = " "

[python]
symbol = " "
